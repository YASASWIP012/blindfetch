[package]
name = "bf-tx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Strip authorizing data from Zcash transactions and check them against their txid"

[features]
# Removing proofs needs the Orchard proof type, which only exists with the
# circuit feature. Wallets and browsers only verify, and do without it.
strip = ["orchard/circuit"]

[dependencies]
bf-core = { path = "../bf-core" }
orchard = { version = "0.16", default-features = false }
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
