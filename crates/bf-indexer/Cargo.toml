[package]
name = "bf-indexer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Builds the Blindfetch database from a lightwalletd server"

[[bin]]
name = "bf-indexer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bf-core = { path = "../bf-core" }
bf-tx = { path = "../bf-tx" }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.21.0", features = ["fs", "macros", "rt-multi-thread", "time", "signal"] }
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["lightwalletd-tonic-tls-webpki-roots"] }
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }
