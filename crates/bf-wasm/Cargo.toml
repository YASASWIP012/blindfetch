[package]
name = "bf-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Blindfetch client for the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bf-core = { path = "../bf-core" }
bf-pir = { path = "../bf-pir" }
bf-tx = { path = "../bf-tx" }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
