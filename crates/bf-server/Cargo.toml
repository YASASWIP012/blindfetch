[package]
name = "bf-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Serves Blindfetch rows over PIR"

[dependencies]
anyhow.workspace = true
axum = "0.8"
bf-core = { path = "../bf-core" }
bf-pir = { path = "../bf-pir", features = ["server"] }
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.21.0", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
